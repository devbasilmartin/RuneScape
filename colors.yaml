bagged_plant_1:  {rgb: [0, 64, 255],    category: item}
oak_plank:       {rgb: [0, 128, 128],   category: item}
mahogany_plank:  {rgb: [0, 192, 128],   category: item}
watering_can:    {rgb: [0, 192, 192],   category: item}
big_bones:       {rgb: [0, 64, 128],    category: item}
shark:           {rgb: [0, 0, 192],     category: item}

