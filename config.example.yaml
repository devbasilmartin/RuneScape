# Copy to config.yaml and adjust. Colors are RGB and must match RuneLite's plugin
# colors exactly (fully opaque). Pick bright colors that don't occur in the game and
# keep them well apart (more than color_tolerance on some channel).
color_tolerance: 25

bank_color: [255, 0, 255]      # Object Markers on every bank booth you use
hp_bar_color: [255, 0, 0]      # Status Bars plugin: health fill color (combat)

# What to do when the game logs you out (6-hour logout, disconnect, server restart):
#   stop    - stop the bot
#   relogin - log back in with SKILLBOT_USERNAME / SKILLBOT_PASSWORD from the environment
on_logout: relogin
login_attempts: 0              # 0 = keep retrying, with backoff up to 15 min
max_consecutive_errors: 5      # stop after this many failed recoveries in a row
max_runtime_hours: 0           # 0 = until the plan is done

# Inventory Tags: one color per item the bot needs to see. Untagged items (axe,
# pickaxe, net, tinderbox, hammer...) are never dropped or banked.
items:
  logs:            [0, 255, 0]
  oak_logs:        [0, 160, 0]
  willow_logs:     [128, 255, 128]
  raw_shrimps:     [0, 128, 255]
  raw_anchovies:   [0, 0, 255]
  shrimps:         [255, 128, 0]
  anchovies:       [255, 200, 100]
  burnt_fish:      [255, 0, 0]
  copper_ore:      [200, 100, 0]
  tin_ore:         [180, 180, 255]
  bronze_bar:      [255, 255, 128]
  bones:           [255, 255, 255]
  cowhide:         [120, 60, 0]
  trout:           [128, 0, 255]

# Ground Markers: tiles clicked in order when a target isn't on screen. Reusing a
# color is fine as long as only one tile of that color is visible at a time.
routes:
  willows_to_bank:  [[255, 255, 255]]
  bank_to_willows:  [[128, 128, 255]]
  bank_to_fish:     [[255, 128, 255]]
  fish_to_bank:     [[255, 255, 255]]
  cows_to_bank:     [[64, 64, 255], [255, 255, 255]]
  bank_to_cows:     [[64, 64, 255], [128, 128, 255]]

# The plan runs top to bottom. A step is skipped once its skill reaches until_level.
# max_minutes rotates to the next step after that long (useful to gather supplies,
# then use them). A process step ends early when the bank runs out of its inputs.
# After the last step it starts again from the top, until everything is done.
plan:
  # --- Woodcutting at Draynor (axe untagged in slot 0) ---
  - name: normal trees
    skill: woodcutting
    task: gather
    until_level: 15
    target: [0, 255, 255]          # Object Markers on the trees
    items: [logs]
    when_full: drop

  - name: oaks
    skill: woodcutting
    task: gather
    until_level: 30
    target: [0, 200, 200]
    items: [oak_logs]
    when_full: drop

  - name: willows
    skill: woodcutting
    task: gather
    until_level: 99
    max_minutes: 120               # then give fishing a turn
    target: [0, 150, 150]
    items: [willow_logs]
    when_full: bank
    walk: {bank: willows_to_bank, target: bank_to_willows}

  # --- Fishing at Draynor (net untagged in slot 0) ---
  - name: net fishing
    skill: fishing
    task: gather
    until_level: 99
    max_minutes: 120
    target: [0, 255, 128]          # NPC Indicators: Fishing spot
    items: [raw_shrimps, raw_anchovies, shrimps, anchovies, burnt_fish]
    when_full: bank
    walk: {bank: fish_to_bank, target: bank_to_fish}

  # --- Firemaking willows from the bank (tinderbox untagged in slot 0) ---
  # Put willow logs in bank slot 0 with the bank quantity set to All.
  - name: burn willows
    skill: firemaking
    task: firemaking
    until_level: 99
    target: [255, 255, 0]          # Ground Marker on the first tile of a clear east-west lane
    items: [willow_logs]
    withdraw: [0]
    tool_slot: 0

  # --- Melee on cows (Lumbridge east field). Rotates styles so all three rise together;
  # Hitpoints comes along for free. Food and loot bank at Lumbridge castle. ---
  - &cows
    name: cows - attack
    skill: attack
    task: combat
    until_level: 40
    max_minutes: 60
    style: 0                       # Combat Options tab: 0 accurate, 1 aggressive, 3 defensive
    target: [255, 128, 255]        # NPC Indicators: Cow
    loot: [255, 200, 0]            # Ground Items: highlight bones + cowhide, tiles on
    items: [cowhide]
    bury: [bones]                  # Prayer from bones
    food: [trout]
    eat_below: 0.5
    withdraw: [0]                  # trout in bank slot 0, bank quantity X = 10
    when_full: bank
    walk: {bank: cows_to_bank, target: bank_to_cows}
  - <<: *cows
    name: cows - strength
    skill: strength
    style: 1
  - <<: *cows
    name: cows - defence
    skill: defence
    style: 3

