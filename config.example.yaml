# Copy to config.yaml and adjust. Colors are RGB and must match the RuneLite plugin
# colors exactly (fully opaque). Use bright colors that don't occur in the game.

# drop | bank | cook_drop | cook_bank
mode: bank

# Things in the game world
fishing_color: [0, 255, 255]   # NPC Indicators: Fishing spot
bank_color: [255, 0, 255]      # Object Markers: Draynor bank booth
cook_color: [255, 255, 0]      # Object Markers: range (or your fire)
color_tolerance: 25

# Inventory Tags: one color per item. Every fish you can end up holding must be
# tagged, or the bot can't see it (and will stop rather than guess).
items:
  raw_shrimps: [0, 255, 0]
  raw_anchovies: [0, 128, 255]
  shrimps: [255, 128, 0]
  anchovies: [160, 0, 255]
  burnt_fish: [255, 0, 0]      # burnt shrimps and burnt anchovies share one tag
raw_items: [raw_shrimps, raw_anchovies]   # what the cook modes cook
tools: 1                       # untagged slots you always carry (small fishing net)

idle_timeout: 25               # seconds with no new fish before clicking a spot again
max_runtime_minutes: 60

# Ground Markers: tiles the bot clicks, in order, when its target isn't on screen.
# At Draynor, zoomed out, the bank and spots are usually both visible, so one
# halfway tile per direction is plenty.
routes:
  to_bank: [[255, 255, 255]]
  to_spot: [[128, 255, 128]]
  to_cook: []

# Override fixed-mode geometry if `python -m fishbot debug` shows boxes out of place.
# layout:
#   inv_origin: [563, 213]
#   slot_step: [42, 36]
