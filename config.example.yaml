# Copy to config.yaml and adjust. Colors are names from colors.yaml (the color registry);
# [r, g, b] works too. RuneLite's plugin colors must match them exactly (fully opaque).
# `python -m skillbot colors` shows the registry; `python -m skillbot setup STEP` prints
# exactly what to mark for a step.
color_tolerance: 25

bank_color: bank               # Object Markers on every bank booth you use
hp_bar_color: status_hp        # Status Bars plugin: health fill color (combat)
danger_color: random_event     # NPC Indicators on random-event NPCs: never clicked

# What to do when the game logs you out (6-hour logout, disconnect, server restart):
#   stop    - stop the bot
#   relogin - log back in with SKILLBOT_USERNAME / SKILLBOT_PASSWORD from the environment
on_logout: relogin
login_attempts: 0              # 0 = keep retrying, with backoff up to 15 min
max_consecutive_errors: 5      # stop after this many failed recoveries in a row
max_runtime_hours: 0           # 0 = until the plan is done

# Run energy, for every step: keep run on, and after running out switch it back on
# once energy reaches run_min_energy. Needs `calibrate-run` and `learn-energy` once;
# while the energy number can't be read it waits run_retry_seconds instead.
run: always                    # always | off
run_min_energy: 50
run_retry_seconds: 60

# Inventory Tags: the items the bot needs to see, each tagged with its registry color.
# Untagged items (axe, pickaxe, net, tinderbox, hammer...) are never dropped or banked.
items: [logs, oak_logs, willow_logs, raw_shrimps, raw_anchovies, shrimps, anchovies,
        burnt_fish, copper_ore, tin_ore, bronze_bar, bones, cowhide, trout, rune_essence,
        earth_rune, fire_rune, earth_talisman, fire_talisman]

# Ground Markers: tiles clicked in order when a target isn't on screen. Each color is
# used at most once within a route; the bot heads for the furthest one it can see.
routes:
  willows_to_bank:  [tile_white]
  bank_to_willows:  [tile_lilac]
  bank_to_fish:     [tile_rose]
  fish_to_bank:     [tile_white]
  cows_to_bank:     [tile_blue, tile_white]
  bank_to_cows:     [tile_blue, tile_lilac]
  # Runecrafting: one tile every ~10 squares.
  varrock_to_earth: [tile_lime, tile_teal, tile_blue]
  earth_to_varrock: [tile_blue, tile_teal, tile_lime]
  alkharid_to_fire: [tile_lime, tile_teal, tile_blue, tile_lemon]
  fire_to_alkharid: [tile_lemon, tile_blue, tile_teal, tile_lime]

# The plan runs top to bottom. A step is skipped once its skill reaches until_level.
# max_minutes rotates to the next step after that long (useful to gather supplies,
# then use them). A process step ends early when the bank runs out of its inputs.
# After the last step it starts again from the top, until everything is done.
plan:
  # --- Woodcutting at Draynor (axe untagged in slot 0) ---
  - name: normal trees
    skill: woodcutting
    task: gather
    until_level: 15
    target: tree                   # Object Markers on the trees
    items: [logs]
    when_full: drop

  - name: oaks
    skill: woodcutting
    task: gather
    until_level: 30
    target: oak_tree
    items: [oak_logs]
    when_full: drop

  - name: willows
    skill: woodcutting
    task: gather
    until_level: 99
    max_minutes: 120               # then give fishing a turn
    target: willow_tree
    items: [willow_logs]
    when_full: bank
    walk: {bank: willows_to_bank, target: bank_to_willows}

  # --- Fishing at Draynor (net untagged in slot 0) ---
  - name: net fishing
    skill: fishing
    task: gather
    until_level: 99
    max_minutes: 120
    target: fishing_spot           # NPC Indicators: Fishing spot
    items: [raw_shrimps, raw_anchovies, shrimps, anchovies, burnt_fish]
    when_full: bank
    walk: {bank: fish_to_bank, target: bank_to_fish}

  # --- Firemaking willows from the bank (tinderbox untagged in slot 0) ---
  # Put willow logs in bank slot 0 with the bank quantity set to All.
  - name: burn willows
    skill: firemaking
    task: firemaking
    until_level: 99
    target: fm_start               # Ground Marker on the first tile of a clear east-west lane
    items: [willow_logs]
    withdraw: [0]
    tool_slot: 0

  # --- Melee on cows (Lumbridge east field). Rotates styles so all three rise together;
  # Hitpoints comes along for free. Food and loot bank at Lumbridge castle. ---
  - &cows
    name: cows - attack
    skill: attack
    task: combat
    until_level: 40
    max_minutes: 60
    style: 0                       # Combat Options tab: 0 accurate, 1 aggressive, 3 defensive
    target: cow                    # NPC Indicators: Cow
    loot: loot                     # Ground Items: highlight bones + cowhide, tiles on
    items: [cowhide]
    bury: [bones]                  # Prayer from bones
    food: [trout]
    eat_below: 0.5
    withdraw: [0]                  # trout in bank slot 0, bank quantity X = 10
    when_full: bank
    walk: {bank: cows_to_bank, target: bank_to_cows}
  - <<: *cows
    name: cows - strength
    skill: strength
    style: 1
  - <<: *cows
    name: cows - defence
    skill: defence
    style: 3

  # --- Runecrafting (after Rune Mysteries): earth runes 9-14, then fire runes to 99.
  # Rune essence in bank slot 0 (quantity All); talisman tagged and kept in the
  # inventory, or wear the tiara and drop enter_with/keep.
  - &runes
    name: earth runes (Varrock east)
    skill: runecraft
    task: runecraft
    until_level: 14
    target: altar                  # Object Markers: the altar
    ruins: ruins                   # Object Markers: Mysterious ruins
    portal: altar_portal           # Object Markers: the exit portal
    items: [rune_essence]
    enter_with: earth_talisman
    keep: [earth_talisman]
    withdraw: [0]
    walk: {bank: earth_to_varrock, target: varrock_to_earth}
  - <<: *runes
    name: fire runes (Al Kharid)
    until_level: 99
    enter_with: fire_talisman
    keep: [fire_talisman]
    walk: {bank: fire_to_alkharid, target: alkharid_to_fire}

