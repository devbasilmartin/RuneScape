# Herblore: secondary on unfinished potion (buy the unf potions), ~2,500 potions/h.
# All need the Druidic Ritual quest. 14 of each per inventory: bank slots 0 and 1
# of each potion's own tag tab.

attack_potions:
  name: "attack potions"
  skills: [herblore]
  levels: [3, 12]
  requires: {quests: ["Druidic Ritual"]}
  xp_per_hour: 62500
  reliability: 5
  location: "grand exchange bank"
  trade: {inputs: {guam_unf: 2500, eye_of_newt: 2500}}
  step: {task: process, items: [guam_unf], use_item: eye_of_newt, with_item: guam_unf, tools: 0,
         confirm: [{key: space}], bank_tab: attack_potions,
         withdraw: [{slot: 0, item: guam_unf, quantity: "x"}, {slot: 1, item: eye_of_newt, quantity: "x"}]}

