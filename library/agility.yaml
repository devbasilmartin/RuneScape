# Agility courses. Mark each obstacle with Object Markers in course order using
# obstacle_1 ... obstacle_7 (long courses start over at obstacle_1); highlight marks of
# grace with Ground Items (or the Agility plugin) in mark_of_grace. XP per hour is a
# rough estimate. Each course's `location` is a destination near its start.

gnome_course:
  name: "Gnome Stronghold course"
  skills: [agility]
  levels: [1, 10]
  xp_per_hour: 6000
  profit_per_hour: 0
  reliability: 4
  location: "gnome stronghold course start"
  step: {task: agility, obstacles: [obstacle_1, obstacle_2, obstacle_3, obstacle_4, obstacle_5, obstacle_6, obstacle_7], laps_per_batch: 5}

