# F2P places the bot can walk between (docs/travel.md). `tile` is the game's world
# coordinate [x, y] (x grows east, y grows north), as on the OSRS Wiki's map. The bot only
# needs to get close: it stops walking once the activity's highlight is on screen, so a
# few tiles off is fine. Names match the library's `location` and `bank_location`.
#
# `arrive` / `leave`: what to do after walking there / before walking away, for places
# upstairs. Each line clicks a highlight (a colors.yaml name), optionally presses a key
# for a dialog choice, and waits.

lumbridge spawn:      {tile: [3222, 3218]}       # the courtyard; home teleport lands here
lumbridge bank:
  tile: [3206, 3209]                             # the castle's south staircase, ground floor
  arrive:
    - {click: stairs, wait: 3}                   # ground floor: Climb-up
    - {click: stairs, key: "1", wait: 3}         # first floor: Climb → "Climb up"
  leave:
    - {click: stairs, wait: 3}                   # top floor: Climb-down
    - {click: stairs, key: "2", wait: 3}         # first floor: Climb → "Climb down"
lumbridge kitchen:    {tile: [3209, 3214]}       # the castle range, ground floor
lumbridge cows:       {tile: [3258, 3275]}       # the field east of the river
lumbridge trees:      {tile: [3195, 3235]}       # west of the castle
lumbridge swamp mine: {tile: [3228, 3148]}

