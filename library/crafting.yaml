# Crafting. Item-on-item at a bank; make-menu keys need checking on your client.
# Rates are rough (gems ~2,700/h; glass ~1,600/h; bodies ~1,000/h).

cut_sapphires:
  name: "cut sapphires"
  skills: [crafting]
  levels: [20, 27]
  xp_per_hour: 135000
  reliability: 5
  location: "grand exchange bank"
  trade: {inputs: {uncut_sapphire: 2700}}
  step: {task: process, items: [uncut_sapphire], use_item: chisel, with_item: uncut_sapphire,
         keep: [chisel], confirm: [{key: space}], bank_tab: crafting,
         withdraw: [{slot: 0, item: uncut_sapphire, quantity: all}]}

