# --- Rune essence: Aubury (Varrock east rune shop) teleports you to the mine; mine until
# full, take the portal out, bank, go back. Needs Rune Mysteries. NPC Indicators: Aubury in
# `aubury`, the mine's Portal in `essence_portal`; Object Markers on the essence rock in
# `essence_rock`. Pickaxe untagged. ---
essence_varrock:
  name: "rune essence (Aubury, Varrock)"
  skills: [mining]
  levels: [1, 99]
  requires: {quests: ["Rune Mysteries"]}
  xp_per_hour: 9000                # low on purpose: it's for runecraft supplies
  reliability: 3
  location: "varrock aubury"
  trade: {outputs: {rune_essence: 1800}}
  step:
    task: routine
    items: [rune_essence]
    bank_location: "varrock east bank"
    routine:
      - name: leave the mine
        when: {full: true, visible: essence_portal}
        do: [{click: essence_portal}, {wait_for: {not_visible: essence_rock}, timeout: 20}]
      - name: bank the essence
        when: {full: true}
        do: [{bank: true}, {travel: "varrock aubury", until: aubury}]
      - name: teleport to the mine     # Aubury's menu: Talk-to, Trade, Teleport
        when: {visible: aubury, not_visible: essence_rock}
        do: [{click: aubury, right_option: Teleport, right_row: 3}, {wait_for: {visible: essence_rock}, timeout: 15}]
      - name: mine
        when: {visible: essence_rock}
        do: [{click: essence_rock}, {wait_for: {full: true}, timeout: 150}, {progress: 1}]

# --- Tanning cowhides into leather at Ellis in Al Kharid (1 coin each: keep coins in the
# inventory, untagged). NPC Indicators: Ellis in `tanner`. Teach the leather button in his
# tanning menu (panel → Learn → Teach a click → tanning: soft leather). Bank tab `crafting`:
# cowhides in slot 2. No XP: it makes leather for crafting. ---
tan_cowhides:
  name: "tan cowhides (Al Kharid)"
  skills: [crafting]
  levels: [1, 99]
  xp_per_hour: 0
  reliability: 3
  location: "al kharid tanner"
  step:
    task: routine
    items: [cowhide]
    bank_location: "al kharid bank"
    bank_tab: crafting
    withdraw: [{slot: 1, item: cowhide, quantity: all}]
    routine:
      - name: get hides
        when: {lacks: cowhide}
        exhausted_if: {lacks: cowhide}
        do: [{bank: true}, {travel: "al kharid tanner", until: tanner}]
      - name: tan them                 # Ellis: Talk-to, Trade; leather button: Tan 1/5/10/X/All
        when: {has: cowhide}
        do: [{click: tanner, right_option: Trade, right_row: 2}, {wait: [1.5, 2]},
             {click: {taught: tan_soft_leather}, right_option: Tan All, right_row: 5},
             {wait_for: {lacks: cowhide}, timeout: 6}, {key: esc}, {progress: 1}]

# --- Prayer: bury bones from the bank at Draynor (the bank is on the ground floor). Bank
# tab `prayer`: bones in slot 0, big bones in slot 1 (from cows and hill giants). ---
bury_bones:
  name: "bury bones (Draynor bank)"
  skills: [prayer]
  levels: [1, 99]
  xp_per_hour: 20000
  reliability: 5
  location: "draynor bank"
  trade: {inputs: {bones: 4000}}
  step:
    task: routine
    items: [bones]
    bank_location: "draynor bank"
    bank_tab: prayer
    withdraw: [{slot: 0, item: bones, quantity: all}]
    routine:
      - name: get bones
        when: {lacks: bones}
        exhausted_if: {lacks: bones}
        do: [{bank: true}]
      - name: bury
        when: {has: bones}
        until_fail: true
        max: 28
        do: [{click: {item: bones}}, {wait: [1.0, 1.2]}, {progress: 1}]

bury_big_bones:
  name: "bury big bones (Draynor bank)"
  skills: [prayer]
  levels: [1, 99]
  xp_per_hour: 50000
  reliability: 5
  location: "draynor bank"
  trade: {inputs: {big_bones: 3300}}
  step:
    task: routine
    items: [big_bones]
    bank_location: "draynor bank"
    bank_tab: prayer
    withdraw: [{slot: 1, item: big_bones, quantity: all}]
    routine:
      - name: get big bones
        when: {lacks: big_bones}
        exhausted_if: {lacks: big_bones}
        do: [{bank: true}]
      - name: bury
        when: {has: big_bones}
        until_fail: true
        max: 28
        do: [{click: {item: big_bones}}, {wait: [1.0, 1.2]}, {progress: 1}]

# --- Crafting: gold jewellery at the Al Kharid furnace (a ring or amulet mould kept in the
