# Starter methods (the ones the bot can already run). XP and profit per hour are rough
# planning estimates for a bot at those levels, not promises; adjust them to what you see.
# `trade` (items per hour in and out) lets the planner use live prices for profit instead.

trees_lumbridge:
  name: "trees (Lumbridge)"
  skills: [woodcutting]
  levels: [1, 15]
  xp_per_hour: 8000
  profit_per_hour: 0
  reliability: 5
  location: "lumbridge trees"
  step: {task: gather, target: tree, items: [logs], when_full: drop}

oaks_draynor:
  name: "oaks (Draynor)"
  skills: [woodcutting]
  levels: [15, 30]
  xp_per_hour: 18000
  profit_per_hour: 0
  reliability: 5
  location: "draynor oaks"
  step: {task: gather, target: oak_tree, items: [oak_logs], when_full: drop}

willows_draynor:
  name: "willows (Draynor)"
  skills: [woodcutting]
  levels: [30, 60]
  xp_per_hour: 35000
  profit_per_hour: 15000
  reliability: 5
  location: "draynor willows"
  requires: {combat: 41}          # dark wizards nearby attack anyone below combat 41
  trade: {outputs: {willow_logs: 500}}
  step:
    bank_location: "draynor bank"
    task: gather
    target: willow_tree
    items: [willow_logs]
    when_full: bank

net_fishing_draynor:
  name: "net fishing (Draynor)"
  skills: [fishing]
  levels: [1, 20]
  xp_per_hour: 8000
  profit_per_hour: 0
  reliability: 5
  location: "draynor fishing"
  step:
    bank_location: "draynor bank"
    task: gather
    target: fishing_spot
    items: [raw_shrimps, raw_anchovies, shrimps, anchovies, burnt_fish]
    when_full: bank

burn_willows:
  name: "burn willows"
  skills: [firemaking]
  levels: [30, 99]
  xp_per_hour: 45000
  profit_per_hour: -20000
  reliability: 4
  location: "grand exchange lane"
  trade: {inputs: {willow_logs: 500}}
  step:
    bank_location: "grand exchange"
    task: firemaking
    target: fm_start
    items: [willow_logs]
    bank_tab: firemaking
    withdraw: [{slot: 0, item: willow_logs, quantity: all}]

cows_lumbridge:
  name: "cows (Lumbridge): kill only"
  skills: [attack, strength, defence]
  levels: [1, 40]
  xp_per_hour: 11000
  reliability: 4
  location: "lumbridge cows"
  step:
    task: combat
    target: cow
    food: [cooked_meat, shrimps, anchovies, trout]     # eaten if you carry any
    eat_below: 0.5
    when_out_of_food: stop

cows_bones_lumbridge:
  name: "cows (Lumbridge): bury bones"
  skills: [attack, strength, defence, prayer]
  levels: [1, 40]
  xp_per_hour: 9000
  profit_per_hour: 2000
  reliability: 4
  location: "lumbridge cows"
  step:
    task: combat
    target: cow
    loot: loot
    items: [cowhide, raw_beef]
    bury: [bones]
    food: [cooked_meat, shrimps, anchovies, trout]
    eat_below: 0.5
    bank_location: "lumbridge bank"
    when_full: drop

earth_runes_varrock:
  name: "earth runes (Varrock)"
  skills: [runecraft]
  levels: [9, 14]
