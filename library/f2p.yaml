# Starter methods (the ones the bot can already run). XP and profit per hour are rough
# planning estimates for a bot at those levels, not promises; adjust them to what you see.
# `trade` (items per hour in and out) lets the planner use live prices for profit instead.

trees_lumbridge:
  name: "trees (Lumbridge)"
  skills: [woodcutting]
  levels: [1, 15]
  xp_per_hour: 8000
  profit_per_hour: 0
  reliability: 5
  location: "lumbridge trees"
  step: {task: gather, target: tree, items: [logs], when_full: drop}

oaks_draynor:
  name: "oaks (Draynor)"
  skills: [woodcutting]
  levels: [15, 30]
  xp_per_hour: 18000
  profit_per_hour: 0
  reliability: 5
  location: "draynor oaks"
  step: {task: gather, target: oak_tree, items: [oak_logs], when_full: drop}

willows_draynor:
  name: "willows (Draynor)"
  skills: [woodcutting]
  levels: [30, 60]
  xp_per_hour: 35000
  profit_per_hour: 15000
  reliability: 5
  location: "draynor willows"
  requires: {combat: 41}          # dark wizards nearby attack anyone below combat 41
  trade: {outputs: {willow_logs: 500}}
  step:
    bank_location: "draynor bank"
    task: gather
    target: willow_tree
    items: [willow_logs]
    when_full: bank

net_fishing_draynor:
  name: "net fishing (Draynor)"
  skills: [fishing]
  levels: [1, 20]
  xp_per_hour: 8000
  profit_per_hour: 0
  reliability: 5
  location: "draynor fishing"
  step:
    bank_location: "draynor bank"
    task: gather
    target: fishing_spot
    items: [raw_shrimps, raw_anchovies, shrimps, anchovies, burnt_fish]
    when_full: bank

burn_willows:
  name: "burn willows"
  skills: [firemaking]
  levels: [30, 99]
  xp_per_hour: 45000
  profit_per_hour: -20000
  reliability: 4
  location: "grand exchange lane"
  trade: {inputs: {willow_logs: 500}}
  step:
    bank_location: "grand exchange"
    task: firemaking
    target: fm_start
    items: [willow_logs]
    bank_tab: firemaking
    withdraw: [{slot: 0, item: willow_logs, quantity: all}]

cows_lumbridge:
  name: "cows (Lumbridge)"
  skills: [attack, strength, defence]
  levels: [1, 40]
  xp_per_hour: 10000
  profit_per_hour: 5000
  reliability: 4
  location: "lumbridge cows"
  trade: {inputs: {trout: 20}, outputs: {cowhide: 150}}
  step:
    bank_location: "lumbridge bank"
    task: combat
    target: cow
    loot: loot
    items: [cowhide, raw_beef]
    bury: [bones]
    food: [cooked_meat, shrimps, anchovies, trout]
    eat_below: 0.5
    bank_tab: food
    withdraw: [{slot: 0, item: trout, quantity: x}]
    when_full: bank

earth_runes_varrock:
  name: "earth runes (Varrock)"
  skills: [runecraft]
  levels: [9, 14]
  requires: {quests: ["Rune Mysteries"]}
  xp_per_hour: 9000
  profit_per_hour: 20000
  reliability: 4
  location: "varrock earth ruins"
  trade: {inputs: {rune_essence: 1400}, outputs: {earth_rune: 1400}}
  step:
    bank_location: "varrock east bank"
    task: runecraft
    target: altar
    ruins: ruins
    portal: altar_portal
    items: [rune_essence]
    enter_with: earth_talisman
    keep: [earth_talisman]
    bank_tab: runecraft
    withdraw: [{slot: 0, item: rune_essence, quantity: all}]

fire_runes_alkharid:
  name: "fire runes (Al Kharid)"
  skills: [runecraft]
  levels: [14, 99]
  requires: {quests: ["Rune Mysteries"]}
  xp_per_hour: 12000
  profit_per_hour: 25000
  reliability: 4
  location: "al kharid fire ruins"
  trade: {inputs: {rune_essence: 1700}, outputs: {fire_rune: 1700}}
  step:
    bank_location: "al kharid bank"
    task: runecraft
    target: altar
    ruins: ruins
    portal: altar_portal
    items: [rune_essence]
    enter_with: fire_talisman
    keep: [fire_talisman]
    bank_tab: runecraft
    withdraw: [{slot: 0, item: rune_essence, quantity: all}]

ourania_altar:
  name: "Ourania altar (ZMI)"
  members: true
  skills: [runecraft]
  levels: [1, 99]
  requires: {quests: ["Lunar Diplomacy"], levels: {magic: 71}}
  xp_per_hour: 40000
  profit_per_hour: 100000
  reliability: 3
  location: "ourania bank"
  trade: {inputs: {pure_essence: 1400}}
  step:
    task: runecraft
    target: altar
    ruins: zmi_ladder               # Object Markers on the ladder down
    leave_spell: ourania_teleport   # Lunar spellbook; its position under spells:
    walk: {altar: zmi_cave}         # Ground Marker route from the ladder to the altar
    items: [pure_essence]
    bank_tab: runecraft
    withdraw: [{slot: 1, item: pure_essence, quantity: all}]

# --- Mining (Varrock east mine: copper, tin and iron next to each other). Mark only the
# rocks you want with Object Markers in `rock`. Drop = fastest XP; bank = keep the ore. ---
copper_tin_varrock:
  name: "copper & tin (Varrock east)"
  skills: [mining]
  levels: [1, 15]
  xp_per_hour: 12000
  reliability: 4
  location: "varrock east mine"
  step:
    task: gather
    target: rock
    items: [copper_ore, tin_ore, uncut_sapphire, uncut_emerald, uncut_ruby, uncut_diamond]
    when_full: drop
    bank_location: "varrock east bank"

iron_varrock:
  name: "iron (Varrock east)"
  skills: [mining]
  levels: [15, 99]
  xp_per_hour: 35000
  reliability: 4
  location: "varrock east mine"
  trade: {outputs: {iron_ore: 900}}
  step:
    task: gather
    target: rock
    items: [iron_ore, uncut_sapphire, uncut_emerald, uncut_ruby, uncut_diamond]
    when_full: drop
    bank_location: "varrock east bank"

# --- Cooking. Best: the fire outside Draynor bank (next to the bank and the fishing).
# Backup: the Lumbridge castle range (bank upstairs). Mark the fire or the range with
# Object Markers in `range`. Bank tab `cooking`: raw beef, shrimps, trout, salmon in
# slots 4-7 (0-3 are for members methods). ---
cook_beef_draynor:
  name: "cook beef (Draynor fire)"
  skills: [cooking]
  levels: [1, 15]
  xp_per_hour: 30000
  reliability: 5
  location: "draynor bank"
  trade: {inputs: {raw_beef: 1000}}
  step: {task: process, target: range, items: [raw_beef], use_item: raw_beef,
         confirm: [{key: "1"}], bank_tab: cooking, bank_location: "draynor bank",
         withdraw: [{slot: 4, item: raw_beef, quantity: all}]}

